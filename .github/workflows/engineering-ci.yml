name: Engineering capability pack

on:
  # Every PR, since `qualify` is a required check: a skipped run never reports, so GitHub never merges it (#394).
  pull_request:
  # A push to main runs the tests it touches, like a PR; the full suite runs nightly (mise check-fast, tools/affected_tests.py).
  push:
    branches:
      - main
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.9.2
          install: false
      - run: mise install
      - run: uv sync --frozen
      # A PR or a push runs lint and the tests it touches; the nightly schedule runs the full suite.
      - if: github.event_name != 'schedule'
        env:
          GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: mise run check-fast
      - if: github.event_name == 'schedule'
        run: mise run check
      - name: Check changed-file whitespace
        if: github.event_name != 'schedule'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --check "$BASE_SHA"...HEAD
