name: Engineering capability pack

on:
  # Every PR, since `qualify` is a required check: a skipped run never reports, so GitHub never merges it (#394).
  # Drafts too: the Mergify merge queue tests each batch as a draft PR from `mergify/merge-queue/<id>` into main, and
  # this trigger runs `qualify` on it, GATE_BASE its base. No `push` trigger on those branches, which would run it twice.
  pull_request:
  # A push to main runs the tests it touches, like a PR; the full suite runs nightly (mise check-fast, tools/affected_tests.py).
  push:
    branches:
      - main
  schedule:
    - cron: "17 2 * * *"
  # The owner's break-glass proof (gatekeeper's breakglass.md) runs the tests a red `qualify` failed alone on the head: `gh workflow run`
  # with `tests` set to their ids, whose run publishes them as `selected` in the `failed-tests` artifact.
  workflow_dispatch:
    inputs:
      tests:
        description: "Test ids to run alone, space-separated; empty runs the usual check"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.9.2
          install: false
      - run: mise install
      - run: uv sync --frozen
      # The test map (tools/affected_tests.py): the newest the nightly saved. Missing, the selector falls back to the name match.
      - if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .test-map
          key: test-map-restore
          restore-keys: test-map-
      # A rerun of a failed job (run_attempt > 1) runs only the tests the earlier attempt failed (tools/failed_tests.py --rerun),
      # not the whole job again; no earlier failure to read (tests off, or the run died) runs the usual check below.
      - id: previous
        if: github.run_attempt > 1 && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        continue-on-error: true
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: failed-tests
          path: .qualify/previous
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - id: rerun
        if: steps.previous.outcome == 'success'
        run: |
          python3 tools/failed_tests.py --rerun .qualify/previous/failed-tests.json > .qualify/rerun.txt
          echo "ids=$(tr '\n' ' ' < .qualify/rerun.txt)" >> "$GITHUB_OUTPUT"
      - if: steps.rerun.outputs.ids != ''
        env:
          IDS: ${{ steps.rerun.outputs.ids }}
        run: |
          mise run vendor-engineering-check && mise run lint
          uv run pytest -q $IDS --junitxml=.qualify/junit.xml
      # A PR or a push runs lint and the tests it touches; the nightly schedule runs the full suite, with a context per test.
      - if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && steps.rerun.outputs.ids == ''
        env:
          GATE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          # one file per run: a check that starts several pytest runs keeps the last one's
          PYTEST_ADDOPTS: --junitxml=.qualify/junit.xml
        run: mise run check-fast
      - if: github.event_name == 'workflow_dispatch' && inputs.tests != ''
        env:
          TESTS: ${{ inputs.tests }}
        run: uv run pytest -q $TESTS --junitxml=.qualify/junit.xml
      - if: github.event_name == 'schedule'
        run: |
          mkdir -p .test-map
          git rev-parse HEAD > .test-map/sha
      - if: github.event_name == 'schedule'
        env:
          COVERAGE_FILE: .test-map/coverage
          # the tests it skips, which leave no coverage context (tools/test_map_plugin.py)
          TEST_MAP_SKIPPED: ${{ github.workspace }}/.test-map/skipped
          GATE_TEST_PARALLEL: "0" # serial: under xdist --cov-context=test records no per-test contexts, so the map would name no test (#1610)
          PYTEST_ADDOPTS: --cov=engineering --cov=tools --cov-context=test --cov-append --cov-report=
        run: mise run check
      # Only a green run: the map names the lines every test ran, which a failed run leaves incomplete.
      - if: github.event_name == 'schedule'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .test-map
          key: test-map-${{ github.sha }}
      # The tests this run ran and failed, as JSON (tools/failed_tests.py), whatever happened before: the owner's
      # break-glass proof reads them (gatekeeper's breakglass.md). No JUnit file (tests are off, or the run died)
      # writes two empty lists, which the proof reads as a failure with no test ids.
      - if: always()
        run: python3 tools/failed_tests.py .qualify/junit.xml .qualify/failed-tests.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-tests
          path: .qualify/failed-tests.json
          overwrite: true # a rerun's attempt publishes under the same name
      - name: Check changed-file whitespace
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --check "$BASE_SHA"...HEAD
