name: Engineering capability pack

on:
  pull_request:
    paths:
      - .github/workflows/engineering-*.yml
      - .agents/**
      - .claude/**
      - .gitattributes
      - apm.yml
      - apm.lock.yaml
      - engineering/**
      - tools/capability_pack/**
      - tests/capability_pack/**
      - tests/automation/**
      - mise.toml
      - pyproject.toml
      - uv.lock
      - .claude-plugin/marketplace.json
      - README.md
      - CLAUDE.md
  push:
    branches:
      - main
    paths:
      - .github/workflows/engineering-*.yml
      - .agents/**
      - .claude/**
      - .gitattributes
      - apm.yml
      - apm.lock.yaml
      - engineering/**
      - tools/capability_pack/**
      - tests/capability_pack/**
      - tests/automation/**
      - mise.toml
      - pyproject.toml
      - uv.lock
      - .claude-plugin/marketplace.json
      - README.md
      - CLAUDE.md

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false
      - run: mise install
      - run: uv sync --frozen
      - run: mise run vendor-engineering-check
      - run: mise run test
      - run: mise run test-engineering-package
      - name: Check changed-file whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --check "$BASE_SHA"...HEAD
