name: Engineering capability pack

on:
  # Every PR, since `qualify` is a required check: a skipped run never reports, so GitHub never merges it (#394).
  # Drafts too: the Mergify merge queue tests each batch as a draft PR from `mergify/merge-queue/<id>` into main, and
  # this trigger runs `qualify` on it, GATE_BASE its base. No `push` trigger on those branches, which would run it twice.
  # The tests run once per tree, on that batch: a PR head runs only the cheap steps, and its `qualify` still reports.
  pull_request:
  # A push to main runs the cheap checks: the batch that made its tree already ran the tests.
  push:
    branches:
      - main
  schedule:
    - cron: "17 2 * * *"
  # The owner's break-glass proof (gatekeeper's breakglass.md) reruns a red `qualify` by R5: `gh workflow run` with `tests` set
  # to the failed ids runs `approvals.py rerun-tests` on them, the red run's whole selection and never the ids alone, and
  # the run publishes what it ran as `selected` in the `failed-tests` artifact.
  workflow_dispatch:
    inputs:
      tests:
        description: "The red run's failed test ids, space-separated, for its one rerun (R5); empty runs the usual check"
        required: false
        default: ""

permissions:
  contents: read
  actions: read # nightly.py moved reads the batch run and the last green from the forge

jobs:
  # Every PR push lints its changed files, with no tests and no build, whatever a gate record says (R1, #2687): a PR head
  # a cloud session pushed never ran the commit hook, so a record of the tests proves no lint. About 1 minute of Actions
  # time a push. Drafts too, as `qualify`. Unlike `qualify`'s own cheap steps it never reads a record.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.9.2
          install: false
      - run: mise install
      - run: uv sync --frozen
      - env:
          GATE_BASE: ${{ github.event.pull_request.base.sha }}
        run: mise run lint-changed
      # a PR body's `Impl:` line must name its session (#2825); drafts included, since this job runs on every pull_request
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: uv run gatekeeper/skills/gatekeeper/scripts/approvals.py check session "$PR"

  qualify:
    runs-on: ubuntu-latest
    # The scheduled full run's limit is gatekeeper.md's `timeouts.run` (60m), never a longer number here: `.mergify.yml`'s checks_timeout
    # derives from it too. The full suite outgrew it run by run (51m in 4578 tests on 11-23, over 60m by 11-26) because the
    # coverage run is serial (-n 0, #1610), so it runs as TEST_SHARDS serial pytest processes at once instead (tools/shard_plugin.py, #2804).
    timeout-minutes: 60 # timeouts.run
    outputs:
      selection: ${{ steps.selection.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # R7 (#2179): main's push run and the nightly run nothing for a tree a batch tested, or a head the last green ran;
      # the answer and the run it names go to the step summary. Every later step of those two events checks `skip`.
      - id: tested
        if: github.event_name == 'push' || github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 loop/skills/engineering-loop/scripts/nightly.py moved ${{ github.event_name }}
      - if: steps.tested.outputs.skip != 'true'
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.9.2
          install: false
      - if: steps.tested.outputs.skip != 'true'
        run: mise install
      - if: steps.tested.outputs.skip != 'true'
        run: uv sync --frozen
      # The test map (tools/affected_tests.py): the newest the nightly saved. Missing, the selector falls back to the name match.
      - if: startsWith(github.head_ref, 'mergify/merge-queue/')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .test-map
          key: test-map-restore
          restore-keys: test-map-
      # A ready PR's head whose tree a worker already passed through `local-ci --record` runs nothing again (R1): the
      # record is for the head's tree, not the test merge commit this job checked out. `qualify` still reports success.
      - id: record
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'mergify/merge-queue/')
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 tools/pr_head_record.py "$HEAD_SHA"
      # A PR or a push runs the cheap checks: vendor check, lint, config and repo checks.
      - if: >-
          github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
          && steps.tested.outputs.skip != 'true' && steps.record.outputs.recorded != 'true'
        run: mise run check-fast
      # A release PR (the Release workflow's `release/` branch) is exactly the fold of its branch point, `cli
      # cut-release` rerun there, or it fails: a hand edit beyond the fold never lands without a verifier (#1861).
      # The PR's own head, not the merge commit, so a main that moved since the cut leaves the check green.
      - if: startsWith(github.head_ref, 'release/')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run python -m tools.capability_pack.cli release-verify --base "$BASE_SHA" --head "$HEAD_SHA"
      # Only a Mergify batch's draft PR runs the tests, what R6 selects against main (test-batch). A step-level
      # `if`, never a job-level one: a PR head's `qualify` must still run and report success, or Mergify never queues it.
      # The prefix is `.mergify.yml`'s `queue_branch_prefix`.
      # A rerun attempt of a red batch run (R5): the same run keeps its artifacts across attempts, so the red attempt's
      # `failed-tests` is read here, which needs `actions: read`. No artifact (tests off, or the run died before writing it),
      # or one with no failed test id, reads nothing and the usual check below runs.
      - id: red
        if: github.run_attempt != '1' && startsWith(github.head_ref, 'mergify/merge-queue/')
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: failed-tests
          path: .qualify/red
      - id: read
        if: steps.red.outcome == 'success'
        run: |
          if python3 -c 'import json,sys; sys.exit(0 if json.load(open(".qualify/red/failed-tests.json"))["failed"] else 1)'; then
            echo red=read >> "$GITHUB_OUTPUT"
          fi
      - id: batch
        if: startsWith(github.head_ref, 'mergify/merge-queue/') && steps.read.outputs.red != 'read'
        env:
          GATE_BASE: ${{ github.event.pull_request.base.sha }}
          # one file per run: a check that starts several pytest runs keeps the last one's
          PYTEST_ADDOPTS: --junitxml=.qualify/junit.xml
        run: mise run test-batch
      # The red attempt's one rerun (R5): its whole selection from its failed ids, head and base, never the failed tests
      # alone, since a test that fails only after others passes alone. A failed test that passes is a flake. Exit 75: it ran no test.
      - id: rerun
        if: steps.read.outputs.red == 'read'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PYTEST_ADDOPTS: --junitxml=.qualify/junit.xml
        run: |
          uv run gatekeeper/skills/gatekeeper/scripts/approvals.py rerun-tests .qualify/red/failed-tests.json --red "$GITHUB_SHA" --base "$BASE_SHA"
          # A rerun recomputes its selection (the test map may have moved), so a pass counts only when it ran every test
          # the red attempt failed, as breakglass.md's Re-run proof asks: never fewer tests than the red run's selection.
          python3 tools/failed_tests.py .qualify/junit.xml .qualify/rerun.json
          python3 - <<'PY'
          import json
          red = json.load(open(".qualify/red/failed-tests.json"))["failed"]
          ran = set(json.load(open(".qualify/rerun.json"))["selected"])
          missing = [test for test in red if test not in ran]
          if missing:
              raise SystemExit("the rerun did not run every test the red attempt failed: " + ", ".join(missing))
          PY
      # what the queue-run job below reads: set only when the batch's test step ran its selection and passed
      - id: selection
        if: steps.batch.outcome == 'success' || steps.rerun.outcome == 'success'
        run: echo selection=ran >> "$GITHUB_OUTPUT"
      # The break-glass proof's rerun: the owner's failed ids as the red run's failed-tests file, on this head, so the
      # run is the red run's whole selection (R5), never `pytest` on the ids alone.
      - if: github.event_name == 'workflow_dispatch' && inputs.tests != ''
        env:
          TESTS: ${{ inputs.tests }}
          PYTEST_ADDOPTS: --junitxml=.qualify/junit.xml
        run: |
          mkdir -p .qualify
          python3 -c 'import json,os; print(json.dumps({"failed": os.environ["TESTS"].split()}))' > .qualify/dispatch.json
          uv run gatekeeper/skills/gatekeeper/scripts/approvals.py rerun-tests .qualify/dispatch.json --red "$GITHUB_SHA" --base origin/main
      - if: github.event_name == 'schedule' && steps.tested.outputs.skip != 'true'
        run: |
          mkdir -p .test-map
          git rev-parse HEAD > .test-map/sha
      - if: github.event_name == 'schedule' && steps.tested.outputs.skip != 'true'
        env:
          COVERAGE_FILE: .test-map/coverage
          # the tests it skips, which leave no coverage context (tools/test_map_plugin.py)
          TEST_MAP_SKIPPED: ${{ github.workspace }}/.test-map/skipped
          # each test's time, across the run's pytest runs (tools/test_map_plugin.py), for the durations step below
          TEST_DURATIONS: ${{ github.workspace }}/.test-map/durations.log
          # the tests it fails: tools/test_map_check.py drops them from the map, so one red test leaves the rest selectable (#1400)
          TEST_MAP_FAILED: ${{ github.workspace }}/.test-map/failed
          GATE_TEST_PARALLEL: "0" # serial: under xdist --cov-context=test records no per-test contexts, so the map would name no test (#1610)
          TEST_SHARDS: "4" # one serial pytest per runner core, each on its share of the test files: the whole suite in a quarter of the time (#2804)
          PYTEST_ADDOPTS: -n 0 --cov --cov-context=test --cov-append --cov-report= # bare --cov: the packages are pyproject.toml's [tool.coverage.run] source, the one list tests/test_packages.py checks (#1400)
        run: mise run check
      # The nightly's per-test durations (#2445): the file `shards --durations` reads, kept beside the test map. Nothing in
      # this repo's CI reads it yet: `affected-tests`' estimate reads it from GATE_DURATIONS where that verb runs, and this
      # repo's selector (`Affected tests:`) lists no tests to estimate, so the fail-fast stays off here (#2445's open question).
      # A red suite still leaves a map (#1400): the run above went red on a failed test, which the steps below run past
      # (`!cancelled()`), and the job stays red. The map is pruned to the tests that passed, then checked: one that measures no
      # source file or names fewer tests than ran fails this step, so no empty map is saved and the selector's "map is empty" is never
      # the first sign of one.
      - id: map
        if: ${{ !cancelled() && github.event_name == 'schedule' && steps.tested.outputs.skip != 'true' }}
        run: python3 tools/test_map_check.py .test-map
      # Each test's time, per test and per file, for the budget check below (`durations --check`, `timeouts.file_budget` and `timeouts.test_budget`).
      - id: durations
        if: ${{ !cancelled() && github.event_name == 'schedule' && steps.tested.outputs.skip != 'true' }}
        run: >-
          python3 gatekeeper/skills/gatekeeper/scripts/gatekeeper.py durations --record .test-map/durations.log
          --out .test-map/durations.json --tests-out .test-map/durations-tests.json
      - if: ${{ !cancelled() && steps.map.outcome == 'success' && github.event_name == 'schedule' && steps.tested.outputs.skip != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .test-map
          key: test-map-${{ github.sha }}
      # The slowest files and tests, and a failure naming each file and test over its budget (timeouts.file_budget, timeouts.test_budget).
      - if: ${{ !cancelled() && steps.durations.outcome == 'success' && github.event_name == 'schedule' && steps.tested.outputs.skip != 'true' }}
        run: >-
          python3 gatekeeper/skills/gatekeeper/scripts/gatekeeper.py durations --check .test-map/durations.json
          --tests .test-map/durations-tests.json
      # The tests this run ran and failed, as JSON (tools/failed_tests.py), whatever happened before: the owner's
      # break-glass proof reads them (gatekeeper's breakglass.md). No JUnit file (tests are off, or the run died)
      # writes two empty lists, which the proof reads as a failure with no test ids.
      - if: always()
        run: python3 tools/failed_tests.py .qualify/junit.xml .qualify/failed-tests.json
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-tests
          path: .qualify/failed-tests.json
          # a rerun attempt shares the run's artifacts, which are immutable per name: its file replaces the red attempt's
          overwrite: true
      - name: Check changed-file whitespace
        # Not skipped on a record: `check-fast`, the command the record proves, never runs `git diff --check`.
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && steps.tested.outputs.skip != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git diff --check "$BASE_SHA"...HEAD

  # The scheduled run's acceptance checks (#1386): every `acceptance/<issue>/` folder, the specs' own proof that nothing
  # else reruns once a spec has landed (SKILL.md, Nightly). Its own job: loop.md's 90-minute nightly budget does not fit
  # `qualify`'s 60, and the two run at once. Skipped, as `qualify`, on a tree the last green nightly ran (R7).
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 90 # loop.md's `Acceptance budget:` nightly minutes
    if: github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: tested
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 loop/skills/engineering-loop/scripts/nightly.py moved schedule
      - if: steps.tested.outputs.skip != 'true'
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.9.2
          install: false
      - if: steps.tested.outputs.skip != 'true'
        run: mise install
      - if: steps.tested.outputs.skip != 'true'
        run: uv sync --frozen
      - if: steps.tested.outputs.skip != 'true'
        run: uv run gatekeeper/skills/gatekeeper/scripts/acceptance.py --all

  # A red scheduled run opens, or adds to, the one `Nightly red since <sha>` issue listing the merges since the last green
  # (#1386, SKILL.md Nightly): a lead bisects from it and lands a fix or a revert as a PR, never an auto-revert. The
  # supervisor reads that issue as an `act` event the day it opens. `issues: write` is this job's alone.
  nightly-red:
    needs: [qualify, acceptance]
    if: always() && github.event_name == 'schedule' && (needs.qualify.result == 'failure' || needs.acceptance.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pull-requests: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.9.2
          install: false
      - run: mise install
      # The newest scheduled run on the default branch that passed, as `nightly.py moved schedule` reads it; none yet,
      # the first commit, so the list is the whole history.
      - id: green
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          sha=$(gh api "repos/$REPO/actions/workflows/engineering-ci.yml/runs?event=schedule&branch=$BRANCH&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')
          [ -n "$sha" ] || sha=$(git rev-list --max-parents=0 HEAD | tail -1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
          LAST_GREEN: ${{ steps.green.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run loop/skills/engineering-loop/scripts/nightly.py red --last-green "$LAST_GREEN" --red "$GITHUB_SHA" --run "$RUN_URL"

  # R6's refusal: `.mergify.yml` merges a batch only on this check's success, which needs the batch step above to have
  # run its selection (tools/cross_change_tests.py). A path that skips it leaves this skipped or red, so nothing merges
  # untested (#2169, #2121). Not a required check of the base: a job-level `if` is safe here, unlike on `qualify`.
  queue-run:
    needs: qualify
    if: startsWith(github.head_ref, 'mergify/merge-queue/')
    runs-on: ubuntu-latest
    steps:
      - env:
          SELECTION: ${{ needs.qualify.outputs.selection }}
        run: |
          [ "$SELECTION" = ran ] || { echo "queue-run: the batch's test step did not run its selection, so the batch does not merge" >&2; exit 1; }
          echo "queue-run: the batch's test step ran its selection"
