name: Engineering tag check

on:
  push:
    tags:
      - engineering-v*

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false
      - run: mise install
      - run: uv sync --frozen
      - run: uv run python -m tools.capability_pack.cli release-check engineering "$GITHUB_REF_NAME"
      - run: mise run vendor-engineering-check
      - run: mise run test
      - run: mise run test-engineering-package
  consumer-sync:
    needs: qualify
    uses: ./.github/workflows/engineering-consumer-sync.yml
    with:
      source_tag: ${{ github.ref_name }}
      source_commit: ${{ github.sha }}
    secrets: inherit
