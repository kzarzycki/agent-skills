name: Engineering upstream check

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          install: false
      - run: mise install
      - run: uv sync --frozen
      - run: mise run vendor-engineering -- --summary /tmp/engineering-update.md
      - run: mise run vendor-engineering-check
      - run: mise run test
      - run: mise run test-engineering-package
      - id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/engineering-upstream
          commit-message: "chore(engineering): refresh upstream skills"
          title: "chore(engineering): refresh upstream skills"
          body-path: /tmp/engineering-update.md
          draft: always-true
