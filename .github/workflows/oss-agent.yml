# Runs a coding agent on one task in a fork of an open-source project, on a free model, and
# opens a draft PR with its change on that fork.
#
# The agent is Claude Code driven through free-claude-code (FCC), a local proxy that serves
# Claude Code's requests from another provider's model, so no Anthropic login or key is in the
# job. Two jobs keep the powers apart:
#   agent   - contents: read and the one model key. Checks out the ref, runs the agent and the
#             project's tests, and uploads the change as a `git format-patch` artifact. Its token
#             cannot push, which a step proves on every run.
#   publish - contents: write and pull-requests: write, and no model key. Applies the patch with
#             `git am`, pushes a branch and opens a draft PR. It runs nothing from the patch.
# No job talks to anything but GitHub and the model provider. tests/test_oss_agent_workflow.py
# holds these rules.
#
# A fork calls it from a workflow of its own, started by hand or with `gh workflow run`:
#
#   on:
#     workflow_dispatch:
#       inputs:
#         task: {description: What the agent should do, required: true}
#   jobs:
#     agent:
#       permissions: {contents: write, pull-requests: write}
#       uses: kzarzycki/agent-skills/.github/workflows/oss-agent.yml@<sha>
#       with:
#         task: ${{ inputs.task }}
#         test_command: <the project's test command>
#         issue: <the number of the issue the PR closes, in this repo>
#       secrets:
#         NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
#
# The fork needs Actions enabled and "Allow GitHub Actions to create and approve pull requests"
# on (Settings, Actions, General) for the draft PR. A PR opened with the job token starts no
# workflow on the fork, and a patch that changes .github/workflows cannot be pushed with it.
#
# Branch push. The publish job pushes refs/heads/oss-agent/run-<run id>-<attempt> with the job
# token, so the calling job must grant contents: write (the example above does), and the fork must
# let that token create it (refs/heads/oss-agent/**). If it has a ruleset that restricts branch creation (one that
# targets all branches, say), the push fails with GH013 after the agent job has spent its run.
# Either of these lets it through, in Settings, Rules, Rulesets:
#   - on the ruleset, under Target branches, add an Exclude by pattern entry `oss-agent/**`; or
#   - on the ruleset, under Bypass list, add the GitHub Actions app with the Always bypass mode,
#     which lets its token create any branch the ruleset covers (the wider of the two).
#
# The PR. It opens as a draft with no labels, which stay with the project's loop. Its body has
# `Closes #<issue>` when `issue` is given, and an `## Evidence` section, the form the gatekeeper's
# `check merge` reads: the `test_command` result, and on a failure the tail of its output (the
# last 60 lines, at most 3000 characters), so a reader can tell a failure the change brought from
# one that was there before.
name: OSS agent

on:
  workflow_call:
    inputs:
      task:
        description: The task, given to the agent as its prompt
        type: string
        required: true
      ref:
        description: Branch to work on and open the PR against; empty means the default branch
        type: string
        default: ""
      model:
        description: FCC model as provider/model; free lists change, so it is an input
        type: string
        default: nvidia_nim/nvidia/nemotron-3-ultra-550b-a55b
      test_command:
        description: The project's test command, run after the agent (empty runs none)
        type: string
        default: ""
      issue:
        description: Number of the issue the PR closes (a `Closes #<issue>` line in its body); empty adds none
        type: string
        default: ""
      timeout_minutes:
        description: The agent job's time limit; a run past it is cancelled
        type: number
        default: 60
      fcc_tag:
        description: free-claude-code release tag; it releases daily, so bump it on purpose
        type: string
        default: v6.19.44
      claude_code_version:
        description: "@anthropic-ai/claude-code version"
        type: string
        default: 2.1.330
      dry_run:
        description: Skip the agent and the publish job, writing a stub change instead (the self-test)
        type: boolean
        default: false
    secrets:
      NVIDIA_NIM_API_KEY:
        description: Free-tier or hard-capped NVIDIA NIM key, used for nothing else
        required: false
    outputs:
      pr_url:
        description: The draft PR, when one was opened
        value: ${{ jobs.publish.outputs.pr_url }}

permissions: {}

# bash -eo pipefail: the default `bash -e` would hide a failing agent behind its `| tee`
defaults:
  run:
    shell: bash

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      contents: read
    outputs:
      has_patch: ${{ steps.patch.outputs.has_patch }}
      base_sha: ${{ steps.base.outputs.sha }}
      base_branch: ${{ steps.base.outputs.branch }}
      tests: ${{ steps.tests.outputs.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - id: base
        env:
          REF: ${{ inputs.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "branch=${REF:-$DEFAULT_BRANCH}" >> "$GITHUB_OUTPUT"

      - name: The job token cannot push
        id: push-refused
        env:
          TOKEN: ${{ github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          probe="oss-agent-push-probe-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if git -c "http.https://github.com/.extraheader=$auth" push origin "HEAD:refs/heads/$probe" 2> "$RUNNER_TEMP/push.err"; then
            echo "::error::the agent job's token pushed $probe; it must be read-only"
            exit 1
          fi
          cat "$RUNNER_TEMP/push.err"
          if ! grep -qiE '403|denied' "$RUNNER_TEMP/push.err"; then
            echo "::error::git push failed, but not with a permission refusal"
            exit 1
          fi
          echo "git push was refused, as it should be"

      - if: ${{ !inputs.dry_run }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - if: ${{ !inputs.dry_run }}
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Install Claude Code and free-claude-code
        if: ${{ !inputs.dry_run }}
        env:
          CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
          FCC_TAG: ${{ inputs.fcc_tag }}
        run: |
          npm install -g "@anthropic-ai/claude-code@$CLAUDE_CODE_VERSION"
          uv tool install --python 3.14.10 "git+https://github.com/Alishahryar1/free-claude-code@$FCC_TAG"

      - name: Start the FCC proxy
        if: ${{ !inputs.dry_run }}
        env:
          NVIDIA_NIM_API_KEY: ${{ secrets.NVIDIA_NIM_API_KEY }}
          MODEL: ${{ inputs.model }}
          HOST: 127.0.0.1
          FCC_OPEN_BROWSER: "false"
        run: |
          if [ -z "$NVIDIA_NIM_API_KEY" ]; then
            echo "::error::the NVIDIA_NIM_API_KEY secret is not passed to this workflow"
            exit 1
          fi
          nohup fcc-server > "$RUNNER_TEMP/fcc-server.log" 2>&1 &
          for _ in $(seq 60); do
            if curl -fsS http://127.0.0.1:8082/health > /dev/null 2>&1; then
              echo "fcc-server is up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::fcc-server did not answer /health within 120 seconds"
          tail -n 50 "$RUNNER_TEMP/fcc-server.log"
          exit 1

      - name: Run the agent
        if: ${{ !inputs.dry_run }}
        env:
          TASK: ${{ inputs.task }}
          MODEL: ${{ inputs.model }}
          HOST: 127.0.0.1
        run: |
          git config user.name "oss-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          fcc-claude -p "$TASK" --dangerously-skip-permissions | tee "$RUNNER_TEMP/agent.out"
          {
            echo "## Agent's last message"
            echo
            tail -c 20000 "$RUNNER_TEMP/agent.out"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stub change (dry run)
        if: ${{ inputs.dry_run }}
        run: echo "oss-agent dry run $GITHUB_RUN_ID" > .oss-agent-dry-run.txt

      - name: Make the patch
        id: patch
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
          TASK: ${{ inputs.task }}
        run: |
          git config user.name "oss-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            printf 'agent: %.60s\n\n%s\n' "$TASK" "$TASK" | git commit -q -F -
          fi
          if [ "$(git rev-parse HEAD)" = "$BASE_SHA" ]; then
            echo "The agent changed nothing."
            echo "has_patch=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/out"
          git format-patch --stdout "$BASE_SHA..HEAD" > "$RUNNER_TEMP/out/agent.patch"
          git diff --stat "$BASE_SHA" HEAD
          echo "has_patch=true" >> "$GITHUB_OUTPUT"

      - name: Run the project's tests
        id: tests
        if: ${{ inputs.test_command != '' }}
        env:
          TEST_COMMAND: ${{ inputs.test_command }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          if bash -c "$TEST_COMMAND" > "$RUNNER_TEMP/tests.log" 2>&1; then
            result=passed
          else
            result=failed
            echo "::warning::the project's tests failed on the agent's change"
          fi
          cat "$RUNNER_TEMP/tests.log"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" = failed ]; then
            tail -n 60 "$RUNNER_TEMP/tests.log" | tail -c 3000 > "$RUNNER_TEMP/out/tests.txt"
          fi

      - if: ${{ steps.patch.outputs.has_patch == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-patch
          path: ${{ runner.temp }}/out
          if-no-files-found: error

  publish:
    needs: agent
    if: ${{ !inputs.dry_run && needs.agent.outputs.has_patch == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_url: ${{ steps.pr.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.agent.outputs.base_sha }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-patch
          path: ${{ runner.temp }}/agent

      - name: Apply and push
        env:
          BRANCH: oss-agent/run-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          git config user.name "oss-agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git am "$RUNNER_TEMP/agent/agent.patch"
          status=0
          push="$(git push origin "HEAD:refs/heads/$BRANCH" 2>&1)" || status=$?
          echo "$push"
          if [[ $push == *GH013* ]]; then
            echo "::error::GH013, the caller repo restricts branch creation. Its rulesets must let the Actions token create refs/heads/oss-agent/** (here $BRANCH): exclude that pattern from the creation-restricting ruleset."
          fi
          exit "$status"

      - name: Open the draft PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: oss-agent/run-${{ github.run_id }}-${{ github.run_attempt }}
          BASE_BRANCH: ${{ needs.agent.outputs.base_branch }}
          TASK: ${{ inputs.task }}
          MODEL: ${{ inputs.model }}
          TESTS: ${{ needs.agent.outputs.tests || 'not run' }}
          ISSUE: ${{ inputs.issue }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Drafted by an agent on a free model ($MODEL) in [this run]($RUN_URL)."
            echo
            if [[ $ISSUE =~ ^[0-9]+$ ]]; then
              echo "Closes #$ISSUE"
              echo
            fi
            echo "## Evidence"
            echo
            echo "Project tests on the change (the \`test_command\` input): $TESTS, in [this run]($RUN_URL)."
            if [[ $TESTS == failed ]]; then
              echo
              echo "The tail of its output:"
              echo
              echo '````text'
              echo "$(head -c 3000 "$RUNNER_TEMP/agent/tests.txt")"
              echo '````'
            fi
            echo
            echo "## Task"
            echo
            echo "$TASK"
          } > "$RUNNER_TEMP/body.md"
          title="$(printf 'agent: %.60s' "$TASK" | head -n 1)"
          url="$(gh pr create --draft --base "$BASE_BRANCH" --head "$BRANCH" --title "$title" --body-file "$RUNNER_TEMP/body.md")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Draft PR: $url" >> "$GITHUB_STEP_SUMMARY"
