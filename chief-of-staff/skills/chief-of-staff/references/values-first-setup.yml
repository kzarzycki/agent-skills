# Sample values file for a setup with a home folder of its own and a tree of project managers.
# Placeholder values only; it holds just what differs from the pack defaults (scripts/cos_values.py keys).
server: https://agents.example.invalid
cos_session: session-cos-1
board: boards/root.md
registry: boards/leads.registry
reports_dir: reports
hosts:
  table:
    repo-a: [host-1, host-2]
    repo-b: [host-2]
  owner_requested_only: [host-2]
managers:
  - scope: [repo-a]
    registry: repo-a-leads.registry
    board: projects/repo-a/board.md
delegation:
  on: true
owner_only: [publish-release]
models:
  tiers:
    lead: model-large
    worker: {model: model-small, until: 2030-01-31}
budget:
  weekly_limit: 100
  until: 2030-01-31
parked: [{item: repo-b-cleanup, until: 2030-01-31}]
decisions:
  file: log/decisions.md
hygiene:
  repos: [owner-a/repo-a, owner-a/repo-b]
verifier:
  route: codex
  # model ids by the PR's risk level; `default` covers every level not named, an unrated PR included
  models: {low: model-low, default: model-default}
  effort: medium
  fallback: [gemini, claude]
