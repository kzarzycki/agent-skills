[tools]
python = "3.14.6"
node = "24.18.0"
uv = "0.11.8"
"github:microsoft/apm" = "0.30.0"
"ubi:carvel-dev/vendir" = "0.46.0"

[tasks.agent-sync]
description = "Converge project-owned coding agent configuration."
usage = '''
flag "--refresh" help="Resolve available dependency releases before convergence"
flag "--frozen" help="Verify the committed lock and generated coding agent state"
'''
run = """
if [ "${usage_refresh:-false}" = true ] && [ "${usage_frozen:-false}" = true ]; then
  echo "error: --refresh and --frozen cannot be combined" >&2
  exit 2
fi
mode=default
if [ "${usage_refresh:-false}" = true ]; then mode=refresh; fi
if [ "${usage_frozen:-false}" = true ]; then mode=frozen; fi
command -v apm >/dev/null || { echo "error: apm 0.30.0 is required; run 'mise install'" >&2; exit 127; }
command -v python3 >/dev/null || { echo "error: python3 is required; run 'mise install'" >&2; exit 127; }
agent_targets="$(python3 -c '
import re
from pathlib import Path

targets = []
in_targets = False
for line in Path("apm.yml").read_text().splitlines():
    if not in_targets:
        in_targets = re.fullmatch(r"targets:\\s*(?:#.*)?", line) is not None
        continue
    stripped = line.strip()
    if not stripped or stripped.startswith("#"):
        continue
    match = re.fullmatch(r"-\\s*([a-z0-9-]+)(?:\\s+#.*)?", stripped)
    if match is None:
        break
    targets.append(match.group(1))
print(",".join(targets))
')"
if [ -z "$agent_targets" ]; then
  echo "error: apm.yml must activate at least one coding agent target" >&2
  exit 2
fi
if [ "$mode" = frozen ]; then
  frozen_changes="$(git status --porcelain=v1 --untracked-files=all -- \
    apm.yml apm.lock.yaml .apm AGENTS.md CLAUDE.md \
    ':(glob)**/AGENTS.md' ':(glob)**/CLAUDE.md' \
    .agents .claude .codex .github/instructions)"
  if [ -n "$frozen_changes" ]; then
    echo "error: frozen agent configuration changed:" >&2
    echo "$frozen_changes" >&2
    echo "run 'mise run agent-sync' and commit the resulting agent configuration" >&2
    exit 1
  fi
fi
case "$mode" in
  default) apm install --target "$agent_targets" ;;
  refresh) apm update --yes --target "$agent_targets" ;;
  frozen)
    apm install --frozen --target "$agent_targets"
    apm audit --ci --no-policy
    ;;
esac
apm compile --clean
apm compile --validate
apm audit --ci --no-policy
if [ -f .mcp.json ]; then python3 -m json.tool .mcp.json >/dev/null; fi
if [ -f .codex/config.toml ]; then python3 -c 'import tomllib; tomllib.load(open(".codex/config.toml", "rb"))'; fi
if [ "$mode" = frozen ]; then
  frozen_changes="$(git status --porcelain=v1 --untracked-files=all -- \
    apm.yml apm.lock.yaml .apm AGENTS.md CLAUDE.md \
    ':(glob)**/AGENTS.md' ':(glob)**/CLAUDE.md' \
    .agents .claude .codex .github/instructions)"
  if [ -n "$frozen_changes" ]; then
    echo "error: frozen agent configuration changed:" >&2
    echo "$frozen_changes" >&2
    echo "run 'mise run agent-sync' and commit the resulting agent configuration" >&2
    exit 1
  fi
fi
"""

[tasks.vendor-engineering]
run = "uv run python -m tools.capability_pack.cli update engineering"

[tasks.vendor-engineering-regenerate]
description = "Regenerate the engineering leaves from their overlays at the locked upstream commit, after an overlay edit."
run = "uv run python -m tools.capability_pack.cli regenerate engineering"

[tasks.vendor-engineering-check]
run = "QUALIFY_TIMEOUT=${QUALIFY_TIMEOUT:-900} uv run python -m tools.capability_pack.cli check engineering"

[tasks.assert-engineering-codex-inventory]
run = "uv run python -m tools.capability_pack.cli assert-codex-inventory ."

[tasks.probe-renovate-vendir]
run = "uv run python tests/adoption/run_renovate_probe.py"

[tasks.test-engineering-package]
run = "uv run pytest -q engineering/tests/test_contract.py engineering/tests/test_package_metadata.py engineering/tests/test_consumer_e2e.py gatekeeper/tests/test_approvals_acceptance_evidence.py"

[tasks.test-engineering-agents]
run = "CLAUDE_CODE_E2E=1 CODEX_E2E=1 uv run pytest -q -m live_agent engineering/tests/e2e"

[tasks.test-chief-of-staff-live]
description = "A chief of staff has a lead of the other harness do an ask, in its repo and across two, both ways, through a logged-in Omnigent"
run = "OMNIGENT_E2E=1 uv run pytest -q -m live_agent chief-of-staff/tests/test_live_chief_of_staff.py"

[tasks.test]
# pytest holds a host gate slot (tools/gate_slot.py: approvals.take_slot, the one local-ci and land take), so gates on one host queue (#395, #1138).
# It runs on pytest-xdist, one worker per free core (tools/gate_workers.py), a file per worker (#941); GATE_TEST_PARALLEL=0 runs serially.
# The `slow` tests run in `test-slow` (and so in the release tag check), not here (#1610).
run = """uv run python tools/gate_slot.py pytest -q -m 'not live_agent and not slow' $([ "${GATE_TEST_PARALLEL:-1}" != 0 ] && printf '%s' '-p tools.gate_workers -n auto --dist loadfile' || printf '%s' '-n 0') && uv run ruff check tools tests engineering/tests engineering/skills/browsing/scripts engineering-hooks/hooks gatekeeper loop github chief-of-staff omnigent && uv run ruff format --check tools tests engineering/tests engineering/skills/browsing/scripts engineering-hooks/hooks gatekeeper loop github chief-of-staff omnigent"""

[tasks.test-slow]
description = "The tests marked slow: nested pytest runs, real installs, heartbeats on real time"
run = """uv run python tools/gate_slot.py pytest -q -m 'slow and not live_agent' $([ "${GATE_TEST_PARALLEL:-1}" != 0 ] && printf '%s' '-p tools.gate_workers -n auto --dist loadfile' || printf '%s' '-n 0')"""

[tasks.lint]
description = "ruff check and format check over the repo's Python"
run = """uv run ruff check tools tests engineering/tests engineering/skills/browsing/scripts engineering-hooks/hooks gatekeeper loop github chief-of-staff omnigent && uv run ruff format --check tools tests engineering/tests engineering/skills/browsing/scripts engineering-hooks/hooks gatekeeper loop github chief-of-staff omnigent"""

[tasks.check-fast]
description = "The PR head's check (`qualify`): vendor check, lint and the Mergify config drift check (the pack template rendered with gatekeeper.md's `land` and `timeouts`), no tests. The tests run once per tree, on the batch (test-batch)."
run = """mise run vendor-engineering-check
mise run lint
uv run gatekeeper/skills/gatekeeper/scripts/approvals.py queue-config | cmp - .mergify.yml || { echo 'error: .mergify.yml drifted from `approvals.py queue-config`, the pack template rendered with gatekeeper.md'"'"'s land block: write its output to .mergify.yml' >&2; exit 1; }"""

[tasks.check-affected]
description = "loop.md's `Affected tests:` run on a PR head: check-fast, then the tests tools/affected_tests.py selects against GATE_BASE (test-batch), so the worker's recorded run proves the PR's tests"
# The queue's selection under the queue's policy: GATE_IN_QUEUE makes the selector read it (tools/affected_tests.py), and the
# root conftest.py hides it from the tests, which see the same environment here and in the queue (#2455).
run = """mise run check-fast
GATE_IN_QUEUE=1 mise run test-batch"""

[tasks.test-batch]
description = "What `qualify` runs on a Mergify batch's draft PR against GATE_BASE (tools/cross_change_tests.py, the per-test map's narrowing over the pack's `queue-select` split, record read and refusal: R6): the select.unkeyed checks, the cross-change tests and the affected tests of a PR with no record, else the batch's affected tests; never the whole suite"
# A selector that fails or refuses (nothing to run on a PR with no record) fails the step. One that selects no test
# runs no pytest and passes, saying so: pytest given no targets would run the whole suite (#1609).
run = """unkeyed=$(mktemp)
targets=$(uv run python -m tools.cross_change_tests --unkeyed-out "$unkeyed" "${GATE_BASE:-origin/main}") || { echo 'error: tools/cross_change_tests.py failed or refused' >&2; exit 1; }
while IFS= read -r check; do sh -c "$check" || { echo "error: the unkeyed check failed: $check" >&2; exit 1; }; done < "$unkeyed"
[ -n "$targets" ] || { echo 'test-batch: tools/cross_change_tests.py selected nothing, so no tests run, never the whole suite' >&2; exit 0; }
uv run python tools/gate_slot.py pytest -q -m 'not live_agent and not slow' -p tools.gate_workers -n auto --dist loadfile --junitxml=.qualify/junit.xml $targets"""

[tasks.check]
description = "Nightly in CI: vendor-engineering-check, lint and the full suite, slow tests included: the one run of the whole suite (#1872)"
# No PR runs the whole suite: the worker runs a PR's affected tests and the Mergify batch the batch's (test-batch), so
# a break the selector misses reaches main and this run finds it within a day (#1872). `test` lints too.
run = [
  "mise run vendor-engineering-check",
  "mise run test",
  "mise run test-slow",
]
