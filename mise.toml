[tools]
python = "3.14.6"
node = "24.18.0"
uv = "0.11.8"
"github:microsoft/apm" = "0.30.0"
"ubi:carvel-dev/vendir" = "0.46.0"

[tasks.agent-sync]
description = "Converge project-owned coding agent configuration."
usage = '''
flag "--refresh" help="Resolve available dependency releases before convergence"
flag "--frozen" help="Verify the committed lock and generated coding agent state"
'''
run = """
if [ "${usage_refresh:-false}" = true ] && [ "${usage_frozen:-false}" = true ]; then
  echo "error: --refresh and --frozen cannot be combined" >&2
  exit 2
fi
mode=default
if [ "${usage_refresh:-false}" = true ]; then mode=refresh; fi
if [ "${usage_frozen:-false}" = true ]; then mode=frozen; fi
command -v apm >/dev/null || { echo "error: apm 0.30.0 is required; run 'mise install'" >&2; exit 127; }
command -v python3 >/dev/null || { echo "error: python3 is required; run 'mise install'" >&2; exit 127; }
agent_targets="$(python3 -c '
import re
from pathlib import Path

targets = []
in_targets = False
for line in Path("apm.yml").read_text().splitlines():
    if not in_targets:
        in_targets = re.fullmatch(r"targets:\\s*(?:#.*)?", line) is not None
        continue
    stripped = line.strip()
    if not stripped or stripped.startswith("#"):
        continue
    match = re.fullmatch(r"-\\s*([a-z0-9-]+)(?:\\s+#.*)?", stripped)
    if match is None:
        break
    targets.append(match.group(1))
print(",".join(targets))
')"
if [ -z "$agent_targets" ]; then
  echo "error: apm.yml must activate at least one coding agent target" >&2
  exit 2
fi
if [ "$mode" = frozen ]; then
  frozen_changes="$(git status --porcelain=v1 --untracked-files=all -- \
    apm.yml apm.lock.yaml .apm AGENTS.md CLAUDE.md \
    ':(glob)**/AGENTS.md' ':(glob)**/CLAUDE.md' \
    .agents .claude .codex .github/instructions)"
  if [ -n "$frozen_changes" ]; then
    echo "error: frozen agent configuration changed:" >&2
    echo "$frozen_changes" >&2
    echo "run 'mise run agent-sync' and commit the resulting agent configuration" >&2
    exit 1
  fi
fi
case "$mode" in
  default) apm install --target "$agent_targets" ;;
  refresh) apm update --yes --target "$agent_targets" ;;
  frozen)
    apm install --frozen --target "$agent_targets"
    apm audit --ci --no-policy
    ;;
esac
apm compile --clean
apm compile --validate
apm audit --ci --no-policy
if [ -f .mcp.json ]; then python3 -m json.tool .mcp.json >/dev/null; fi
if [ -f .codex/config.toml ]; then python3 -c 'import tomllib; tomllib.load(open(".codex/config.toml", "rb"))'; fi
if [ "$mode" = frozen ]; then
  frozen_changes="$(git status --porcelain=v1 --untracked-files=all -- \
    apm.yml apm.lock.yaml .apm AGENTS.md CLAUDE.md \
    ':(glob)**/AGENTS.md' ':(glob)**/CLAUDE.md' \
    .agents .claude .codex .github/instructions)"
  if [ -n "$frozen_changes" ]; then
    echo "error: frozen agent configuration changed:" >&2
    echo "$frozen_changes" >&2
    echo "run 'mise run agent-sync' and commit the resulting agent configuration" >&2
    exit 1
  fi
fi
"""

[tasks.vendor-engineering]
run = "uv run python -m tools.capability_pack.cli update engineering"

[tasks.vendor-engineering-regenerate]
description = "Regenerate the engineering leaves from their overlays at the locked upstream commit, after an overlay edit."
run = "uv run python -m tools.capability_pack.cli regenerate engineering"

[tasks.vendor-engineering-check]
run = "QUALIFY_TIMEOUT=${QUALIFY_TIMEOUT:-900} uv run python -m tools.capability_pack.cli check engineering"

[tasks.assert-engineering-codex-inventory]
run = "uv run python -m tools.capability_pack.cli assert-codex-inventory ."

[tasks.probe-renovate-vendir]
run = "uv run python tests/adoption/run_renovate_probe.py"

[tasks.test-engineering-package]
run = "uv run pytest -q engineering/tests/test_contract.py engineering/tests/test_package_metadata.py engineering/tests/test_consumer_e2e.py engineering/tests/test_approvals_acceptance_evidence.py"

[tasks.test-engineering-agents]
run = "CLAUDE_CODE_E2E=1 CODEX_E2E=1 uv run pytest -q -m live_agent engineering/tests/e2e"

[tasks.test-chief-of-staff-live]
description = "A chief of staff has a lead of the other harness do an ask, in its repo and across two, both ways, through a logged-in Omnigent"
run = "OMNIGENT_E2E=1 uv run pytest -q -m live_agent engineering/tests/e2e/test_live_chief_of_staff.py"

[tasks.test]
# pytest holds a host gate slot (tools/gate_slot.py: approvals.take_slot, the one local-ci and land take), so gates on one host queue (#395, #1138).
# GATE_TEST_PARALLEL=1 runs it on pytest-xdist, one worker per free core (tools/gate_workers.py), a file per worker (#941); unset, serially.
run = """uv run python tools/gate_slot.py pytest -q -m 'not live_agent' $([ "${GATE_TEST_PARALLEL:-0}" = 1 ] && printf '%s' '-p tools.gate_workers -n auto --dist loadfile') && uv run ruff check tools tests engineering/tests engineering/skills/engineering-loop/scripts engineering/skills/orchestrating-agents/scripts engineering/skills/chief-of-staff/scripts engineering/skills/omnigent-telemetry/scripts engineering/hooks && uv run ruff format --check tools tests engineering/tests engineering/skills/engineering-loop/scripts engineering/skills/orchestrating-agents/scripts engineering/skills/chief-of-staff/scripts engineering/skills/omnigent-telemetry/scripts engineering/hooks"""

[tasks.lint]
description = "ruff check and format check over the repo's Python"
run = """uv run ruff check tools tests engineering/tests engineering/skills/engineering-loop/scripts engineering/skills/orchestrating-agents/scripts engineering/skills/chief-of-staff/scripts engineering/skills/omnigent-telemetry/scripts engineering/hooks && uv run ruff format --check tools tests engineering/tests engineering/skills/engineering-loop/scripts engineering/skills/orchestrating-agents/scripts engineering/skills/chief-of-staff/scripts engineering/skills/omnigent-telemetry/scripts engineering/hooks"""

[tasks.check-land]
description = "The landing gate: vendor check and lint, nothing else, about a minute."
# ponytail: a landing runs no tests, so a break reaches main until the PR's `qualify` check (check-fast) or the nightly full
# suite catches it; fix it forward. Interim until the approvals tests run in seconds; then check-fast is the gate again.
run = """mise run vendor-engineering-check
mise run lint"""

[tasks.check-fast]
description = "The PR check (`qualify`): vendor check, lint, and only the tests the change touches (tools/affected_tests.py), on pytest-xdist (a file per free core, tools/gate_workers.py; GATE_TEST_PARALLEL=0 runs them serially). The full suite runs nightly in CI."
# ponytail: a PR runs its own touched tests only, so a combination that breaks an untouched test reaches main; the nightly
# full run catches it, a bisect names the PR, and the fix goes forward on main. Upgrade path: a suite that runs in seconds
# lets `check` come back as the gate.
run = """mise run vendor-engineering-check
uv run python tools/gate_slot.py sh -c 'uv run pytest -q -m "not live_agent" $([ "${GATE_TEST_PARALLEL:-1}" = 1 ] && printf "%s" "-p tools.gate_workers -n auto --dist loadfile") $(uv run python tools/affected_tests.py ${GATE_BASE:-origin/main})'
mise run lint"""

[tasks.check]
description = "The full suite, nightly in CI: vendor-engineering-check, test, test-engineering-package"
run = [
  "mise run vendor-engineering-check",
  "mise run test",
  "mise run test-engineering-package",
]
