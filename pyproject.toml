[project]
name = "agent-skills"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["PyYAML==6.0.3"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.0"]

[tool.pytest.ini_options]
testpaths = ["tests", "engineering/tests"]
pythonpath = ["."]
markers = ["live_agent: tests that require a live agent runtime"]

[tool.ruff]
target-version = "py314"
line-length = 100
