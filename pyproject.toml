[project]
name = "agent-skills"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["PyYAML==6.0.3"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.0"]

[tool.pytest.ini_options]
testpaths = ["tests", "engineering/tests"]
pythonpath = ["."]
markers = ["live_agent: tests that require a live agent runtime"]

[tool.ruff]
target-version = "py314"
line-length = 100
# Shipped scripts run on a consumer's own `python3`; macOS ships 3.9.
per-file-target-version = { "engineering/skills/*/scripts/*.py" = "py39" }

[tool.ruff.lint.per-file-ignores]
# A module of approvals tests imports a non-autouse fixture it takes from the harness by name (with
# `noqa: F401`), and a test that takes it as a parameter redefines it (engineering/tests/approvals_harness.py).
"engineering/tests/test_approvals_*.py" = ["F811"]
# likewise a module that takes test_mutate.py's `repo` fixture by name
"engineering/tests/test_mutate_*.py" = ["F811"]
