[project]
name = "agent-skills"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = ["PyYAML==6.0.3"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-timeout==2.4.0",
    "pytest-xdist==3.8.0",
    "ruff==0.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "engineering/tests"]
pythonpath = ["."]
# A test that outlives 60 s fails with every thread's traceback instead of holding the landing lock for the queue;
# a test that needs longer carries @pytest.mark.timeout(N). QUALIFY_TIMEOUT does not cover pytest.
timeout = 60
timeout_method = "signal"
markers = [
  "live_agent: tests that require a live agent runtime",
  "slow: tests that take seconds each (a nested pytest, a real install, a heartbeat on real time): `mise run test` leaves them out, `mise run test-slow` runs them and `mise run check` includes that (#1610)",
  "needs_tool(*tools): the external tools a test runs beyond git and Python; a run selecting it stops first when PATH lacks one",
]

# The test map (tools/affected_tests.py): the nightly runs the suite with `--cov-context=test`, so the data says which
# test executed each line. relative_files keeps the paths the same across checkouts; patch/parallel record the scripts
# a test runs as a subprocess (their lines carry no test, so the selector falls back to the name match for them).
[tool.coverage.run]
relative_files = true
parallel = true
patch = ["subprocess"]

[tool.ruff]
target-version = "py314"
line-length = 100
# Shipped scripts run on a consumer's own `python3`; macOS ships 3.9.
per-file-target-version = { "engineering/skills/*/scripts/*.py" = "py39", "engineering/hooks/*.py" = "py39" }

[tool.ruff.lint.per-file-ignores]
# A module of approvals tests imports a non-autouse fixture it takes from the harness by name (with
# `noqa: F401`), and a test that takes it as a parameter redefines it (engineering/tests/approvals_harness.py).
"engineering/tests/test_approvals_*.py" = ["F811"]
# likewise a module that takes test_mutate.py's `repo` fixture by name
"engineering/tests/test_mutate_*.py" = ["F811"]
