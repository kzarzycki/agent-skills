apiVersion: vendir.k14s.io/v1alpha1
kind: Config
directories:
  - path: skills/grilling
    contents:
      - path: .
        git:
          url: UPSTREAM_REPOSITORY
          ref: origin/main
        includePaths:
          - skills/productivity/grilling/**/*
        excludePaths: []
        legalPaths: []
        newRootPath: skills/productivity/grilling
