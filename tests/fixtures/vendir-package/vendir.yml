apiVersion: vendir.k14s.io/v1alpha1
kind: Config
minimumRequiredVersion: 0.46.0
directories:
  - path: skills/alpha
    contents:
      - path: .
        git:
          url: UPSTREAM_REPOSITORY
          ref: origin/main
        includePaths:
          - skills/engineering/alpha/**/*
        excludePaths: []
        legalPaths: []
        newRootPath: skills/engineering/alpha
  - path: skills/beta
    contents:
      - path: .
        git:
          url: UPSTREAM_REPOSITORY
          ref: origin/main
        includePaths:
          - skills/engineering/beta/**/*
        excludePaths: []
        legalPaths: []
        newRootPath: skills/engineering/beta
  - path: skills/setup-engineering-workflow-for-apm
    contents:
      - path: .
        git:
          url: UPSTREAM_REPOSITORY
          ref: origin/main
        includePaths:
          - skills/engineering/setup-matt-pocock-skills/**/*
        excludePaths: []
        legalPaths: []
        newRootPath: skills/engineering/setup-matt-pocock-skills
  - path: skills/grilling
    contents:
      - path: .
        git:
          url: UPSTREAM_REPOSITORY
          ref: origin/main
        includePaths:
          - skills/productivity/grilling/**/*
        excludePaths: []
        legalPaths: []
        newRootPath: skills/productivity/grilling
