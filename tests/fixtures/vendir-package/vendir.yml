apiVersion: vendir.k14s.io/v1alpha1
kind: Config
directories:
  - path: skills
    contents:
      - path: .
        git:
          url: UPSTREAM_REPOSITORY
          ref: origin/main
        includePaths:
          - skills/engineering/**/*
        excludePaths:
          - skills/engineering/setup-matt-pocock-skills/**/*
        legalPaths: []
        newRootPath: skills/engineering
        ignorePaths:
          - audit-third-party-software/**/*
          - context-extractor/**/*
          - operating-omnigent/**/*
          - setup-engineering-workflow-for-apm/**/*
          - grilling/**/*
